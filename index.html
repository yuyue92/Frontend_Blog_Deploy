<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 全局 Loading（解决切页/详情渲染延迟） ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-card {
            width: 260px;
            padding: 18px 16px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(24, 144, 255, 0.20);
            border-top-color: #1890ff;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 13px;
            color: #333;
        }

        /* 顶部栏 */
        .topbar {
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .topbar h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        /* 主容器 */
        .main-container {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* 左侧菜单 */
        .sidebar {
            width: 200px;
            background: #001529;
            color: white;
            overflow-y: auto;
        }

        .menu-item {
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .menu-item.active {
            background: #1890ff;
            border-left-color: #40a9ff;
        }

        .menu-item.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Toast 消息（替代顶部状态条提示） */
        .toast-container {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: min(360px, calc(100vw - 28px));
        }

        .toast {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: toast-in 0.18s ease-out;
        }

        @keyframes toast-in {
            from {
                transform: translateY(-6px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast .dot {
            width: 10px;
            height: 10px;
            margin-top: 4px;
            border-radius: 50%;
            background: #1890ff;
            flex: 0 0 auto;
        }

        .toast.success .dot {
            background: #52c41a;
        }

        .toast.error .dot {
            background: #ff4d4f;
        }

        .toast.info .dot {
            background: #1890ff;
        }

        .toast .content {
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .toast .close {
            margin-left: auto;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0 2px;
        }

        .toast .close:hover {
            color: #fff;
        }

        /* 右侧内容区 */
        .content-area {
            flex: 1;
            background: #fff;
            margin: 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            overflow-y: auto;
            padding: 20px;
        }

        /* 按钮样式 */
        .btn {
            padding: 6px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-primary {
            background: #1890ff;
            color: white;
        }

        .btn-primary:hover {
            background: #40a9ff;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #ff4d4f;
            color: white;
        }

        .btn-danger:hover {
            background: #ff7875;
        }

        .btn-success {
            background: #52c41a;
            color: white;
        }

        .btn-small {
            padding: 4px 10px;
            font-size: 12px;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid #d9d9d9;
            color: #333;
        }

        .btn-ghost:hover {
            border-color: #1890ff;
            color: #1890ff;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* 提示框 */
        .alert {
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
            font-size: 13px;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }

        .alert-error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }

        /* 页面标题 */
        .page-header {
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .page-header h2 {
            font-size: 18px;
            color: #333;
        }

        .page-subtitle {
            color: #8c8c8c;
            font-size: 12px;
            margin-top: 2px;
        }

        .back-btn {
            margin-bottom: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8c8c8c;
            font-size: 13px;
        }

        /* 配置区域 */
        .config-section {
            background: #fafafa;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 16px;
            border: 1px solid #f0f0f0;
        }

        .config-section h3 {
            margin-bottom: 12px;
            color: #333;
            font-size: 15px;
        }

        .test-results {
            margin-top: 16px;
            padding: 12px;
            background: #fafafa;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #f0f0f0;
        }

        .test-item {
            padding: 6px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .test-success {
            background: #f6ffed;
            color: #52c41a;
        }

        .test-error {
            background: #fff2f0;
            color: #ff4d4f;
        }

        .hidden {
            display: none !important;
        }

        /* ===== 首页/列表：更紧凑结构 + 评论数 + 分页 ===== */
        .list-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .list-toolbar .left {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .list-toolbar .right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .muted {
            color: #8c8c8c;
            font-size: 12px;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .post-card {
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 12px 14px;
            transition: all 0.2s;
            background: #fff;
        }

        .post-card:hover {
            border-color: rgba(24, 144, 255, 0.55);
            box-shadow: 0 2px 10px rgba(24, 144, 255, 0.12);
        }

        .post-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .post-title {
            color: #333;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.35;
            margin: 0;
        }

        .post-title:hover {
            color: #1890ff;
        }

        .post-meta {
            color: #8c8c8c;
            font-size: 12px;
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .post-content {
            color: #555;
            line-height: 1.65;
            margin-top: 8px;
            font-size: 13px;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #f0f0f0;
            background: #fafafa;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 34px;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid #d9d9d9;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            border-color: #1890ff;
            color: #1890ff;
        }

        .page-btn.active {
            border-color: #1890ff;
            background: #1890ff;
            color: #fff;
        }

        .page-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* 评论卡片 */
        .comment-card {
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #1890ff;
        }

        .comment-meta {
            color: #8c8c8c;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .comment-content {
            color: #333;
            line-height: 1.6;
            font-size: 13px;
            white-space: pre-wrap;
        }

        /* 详情页样式 */
        .post-detail-header {
            margin-bottom: 16px;
        }

        .post-detail-header h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 8px;
        }

        .comments-section {
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid #f0f0f0;
        }

        .comments-section h3 {
            font-size: 16px;
            margin-bottom: 14px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 160px;
            }

            .topbar h1 {
                font-size: 16px;
            }

            .content-area {
                margin: 8px;
                padding: 12px;
            }

            .post-head {
                flex-direction: column;
                align-items: stretch;
            }

            .post-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>
    <!-- 全局 Loading -->
    <div id="globalLoading" class="loading-overlay hidden" aria-live="polite" aria-busy="true">
        <div class="loading-card">
            <div class="spinner" aria-hidden="true"></div>
            <div class="loading-text" id="loadingText">加载中...</div>
        </div>
    </div>

    <!-- 顶部栏 -->
    <div class="topbar">
        <h1>🚀 个人博客管理系统</h1>
        <div class="user-info">
            <span id="userDisplay"></span>
            <button id="logoutBtn" class="btn btn-secondary btn-small hidden">退出</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧菜单 -->
        <div class="sidebar">
            <div class="menu-item active" data-page="home">📚 首页</div>
            <div class="menu-item" data-page="login" id="menuLogin">🔐 登录</div>
            <div class="menu-item" data-page="register" id="menuRegister">📝 注册</div>
            <div class="menu-item" data-page="myPosts" id="menuMyPosts">📖 我的文章</div>
            <div class="menu-item" data-page="createPost" id="menuCreatePost">✏️ 发布文章</div>
            <div class="menu-item" data-page="test">🧪 API测试</div>
        </div>

        <!-- 右侧内容区 -->
        <div class="content-area">
            <div id="toastContainer" class="toast-container"></div>

            <!-- 首页 -->
            <div id="homePage" class="page">
                <div class="page-header">
                    <div>
                        <h2>最新文章</h2>
                        <div class="page-subtitle" id="homeSubTitle">—</div>
                    </div>
                    <div class="right">
                        <button class="btn btn-ghost btn-small" onclick="app.refreshHome()">🔄 刷新</button>
                    </div>
                </div>
                <div class="list-toolbar">
                    <div class="left">
                        <span class="muted" id="homeCount">共 0 篇</span>
                    </div>
                    <div class="right">
                        <span class="muted">每页</span>
                        <select id="homePageSize" onchange="app.setPageSize('home', this.value)"
                            style="padding:6px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
                <div id="postsList" class="post-list"></div>
                <div id="homePagination" class="pagination"></div>
            </div>

            <!-- 登录页 -->
            <div id="loginPage" class="page hidden">
                <div class="page-header">
                    <h2>用户登录</h2>
                    <div class="right"></div>
                </div>
                <form id="loginForm" style="max-width: 400px;">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary">登录</button>
                </form>
            </div>

            <!-- 注册页 -->
            <div id="registerPage" class="page hidden">
                <div class="page-header">
                    <h2>用户注册</h2>
                    <div class="right"></div>
                </div>
                <form id="registerForm" style="max-width: 400px;">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="regUsername" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="regEmail" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="regPassword" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">注册并自动登录</button>
                </form>
            </div>

            <!-- 我的文章 -->
            <div id="myPostsPage" class="page hidden">
                <div class="page-header">
                    <div>
                        <h2>我的文章</h2>
                        <div class="page-subtitle" id="mySubTitle">—</div>
                    </div>
                    <div class="right">
                        <button class="btn btn-ghost btn-small" onclick="app.refreshMyPosts()">🔄 刷新</button>
                    </div>
                </div>
                <div class="list-toolbar">
                    <div class="left">
                        <span class="muted" id="myCount">共 0 篇</span>
                    </div>
                    <div class="right">
                        <span class="muted">每页</span>
                        <select id="myPageSize" onchange="app.setPageSize('my', this.value)"
                            style="padding:6px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                </div>
                <div id="myPostsList" class="post-list"></div>
                <div id="myPagination" class="pagination"></div>
            </div>

            <!-- 发布文章 -->
            <div id="createPostPage" class="page hidden">
                <div class="page-header">
                    <h2>发布文章</h2>
                    <div class="right"></div>
                </div>
                <form id="createPostForm" style="max-width: 800px;">
                    <div class="form-group">
                        <label>标题</label>
                        <input type="text" id="postTitle" required>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="postContent" required rows="24"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">发布</button>
                </form>
            </div>

            <!-- 文章详情 -->
            <div id="postDetailPage" class="page hidden">
                <button class="btn btn-secondary back-btn" onclick="app.backFromDetail()">← 返回</button>
                <div id="postDetail"></div>
                <div class="comments-section">
                    <h3>💬 评论区</h3>
                    <form id="commentForm" class="hidden" style="margin-bottom: 16px;">
                        <div class="form-group">
                            <textarea id="commentContent" placeholder="写下你的评论..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">发表评论</button>
                    </form>
                    <div id="commentsList"></div>
                </div>
            </div>

            <!-- 编辑文章 -->
            <div id="editPostPage" class="page hidden">
                <button class="btn btn-secondary back-btn" onclick="app.showPage('myPosts')">← 返回</button>
                <div class="page-header">
                    <h2>编辑文章</h2>
                    <div class="right"></div>
                </div>
                <form id="editPostForm" style="max-width: 800px;">
                    <input type="hidden" id="editPostId">
                    <div class="form-group">
                        <label>标题</label>
                        <input type="text" id="editPostTitle" required>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="editPostContent" required rows="24"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                </form>
            </div>

            <!-- API测试 -->
            <div id="testPage" class="page hidden">
                <div class="page-header">
                    <h2>API测试中心</h2>
                    <div class="right"></div>
                </div>

                <div class="config-section">
                    <h3>⚙️ 配置</h3>
                    <div class="form-group">
                        <label>API Base URL</label>
                        <input type="text" id="apiBaseUrl" value="http://localhost:8080/api/v1">
                    </div>
                    <button class="btn btn-primary" onclick="app.saveConfig()">保存配置</button>
                </div>

                <div class="config-section">
                    <h3>🔍 测试选项</h3>
                    <button class="btn btn-success" onclick="app.runAllTests()">运行全部测试</button>
                    <button class="btn btn-primary" onclick="app.testHealth()">健康检查</button>
                    <button class="btn btn-primary" onclick="app.testAuth()">测试认证</button>
                    <button class="btn btn-primary" onclick="app.testPosts()">测试文章</button>
                    <button class="btn btn-primary" onclick="app.testComments()">测试评论</button>
                    <button class="btn btn-danger" onclick="app.clearTestResults()">清除结果</button>
                </div>

                <div class="test-results" id="testResults">
                    <p style="color: #8c8c8c;">测试结果将显示在这里...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        var app = {
            // apiBase: 'http://localhost:8080/api/v1',
            apiBase: 'https://render-golang-blog-supabase.onrender.com/api/v1',
            token: localStorage.getItem('token') || '',
            user: null,
            currentPost: null,
            lastListPage: 'home',

            // 列表数据与分页（前端分页：兼容后端不支持分页的场景）
            state: {
                home: { all: [], page: 1, pageSize: 10, total: 0, totalPage: 1 },
                my: { all: [], page: 1, pageSize: 10, total: 0, totalPage: 1 }
            },

            // 全局 loading 计数（避免并发请求闪烁）
            _loadingCount: 0,

            init: function () {
                this.loadConfig();
                this.bindEvents();
                this.updateAuthMenus();

                if (this.token) {
                    this.fetchProfile();
                }

                this.fetchPosts({ silent: false });
            },

            /* ===== 工具方法 ===== */
            setLoading: function (on, text) {
                var overlay = document.getElementById('globalLoading');
                var textEl = document.getElementById('loadingText');
                if (on) {
                    this._loadingCount += 1;
                    if (text) textEl.textContent = text;
                    overlay.classList.remove('hidden');
                } else {
                    this._loadingCount = Math.max(0, this._loadingCount - 1);
                    if (this._loadingCount === 0) {
                        overlay.classList.add('hidden');
                        textEl.textContent = '加载中...';
                    }
                }
            },

            requestJson: function (url, options, loadingText) {
                var self = this;
                options = options || {};
                if (loadingText) self.setLoading(true, loadingText);

                return fetch(url, options)
                    .then(function (res) { return res.json(); })
                    .finally(function () {
                        if (loadingText) self.setLoading(false);
                    });
            },

            escapeHtml: function (s) {
                if (s === null || s === undefined) return '';
                return String(s)
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#039;');
            },

            formatTime: function (iso) {
                try {
                    return new Date(iso).toLocaleString('zh-CN');
                } catch (e) {
                    return iso || '';
                }
            },

            /* ===== 配置 ===== */
            loadConfig: function () {
                var saved = localStorage.getItem('apiBase');
                if (saved) {
                    this.apiBase = saved;
                    document.getElementById('apiBaseUrl').value = saved;
                }
            },

            saveConfig: function () {
                this.apiBase = document.getElementById('apiBaseUrl').value;
                localStorage.setItem('apiBase', this.apiBase);
                this.showAlert('success', '配置已保存');
            },

            /* ===== 事件绑定 ===== */
            bindEvents: function () {
                var self = this;

                document.querySelectorAll('.menu-item').forEach(function (item) {
                    item.addEventListener('click', function (e) {
                        var page = e.currentTarget.dataset.page;
                        self.showPage(page);
                    });
                });

                document.getElementById('loginForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    self.handleLogin();
                });

                document.getElementById('registerForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    self.handleRegisterAutoLogin();
                });

                document.getElementById('createPostForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    self.handleCreatePost();
                });

                document.getElementById('editPostForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    self.handleUpdatePost();
                });

                document.getElementById('commentForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    self.handleCreateComment();
                });

                document.getElementById('logoutBtn').addEventListener('click', function () {
                    self.handleLogout();
                });
            },

            /* ===== 页面切换 ===== */
            showPage: function (page) {
                // 未登录时：禁用需要登录的页面，并停留在登录页
                var protectedPages = ['home', 'myPosts', 'createPost', 'test'];
                if (!this.token && protectedPages.indexOf(page) !== -1) {
                    this.showToast('error', '请先登录');
                    page = 'login';
                }
                // 基础切页：不做 async，避免把旧内容留在页面上太久
                document.querySelectorAll('.page').forEach(function (p) {
                    p.classList.add('hidden');
                });
                document.querySelectorAll('.menu-item').forEach(function (m) {
                    m.classList.remove('active');
                });

                var pageMap = {
                    'home': 'homePage',
                    'login': 'loginPage',
                    'register': 'registerPage',
                    'myPosts': 'myPostsPage',
                    'createPost': 'createPostPage',
                    'test': 'testPage'
                };

                var pageId = pageMap[page];
                if (pageId) {
                    document.getElementById(pageId).classList.remove('hidden');
                    var menuItem = document.querySelector('[data-page="' + page + '"]');
                    if (menuItem) menuItem.classList.add('active');
                }

                if (page === 'myPosts') {
                    this.lastListPage = 'myPosts';
                    // 同步选择器的值
                    var myPageSizeSelect = document.getElementById('myPageSize');
                    if (myPageSizeSelect) {
                        myPageSizeSelect.value = this.state.my.pageSize || 10;
                    }
                    this.fetchMyPosts({ silent: false });
                } else if (page === 'home') {
                    this.lastListPage = 'home';
                    // 同步选择器的值
                    var homePageSizeSelect = document.getElementById('homePageSize');
                    if (homePageSizeSelect) {
                        homePageSizeSelect.value = this.state.home.pageSize || 10;
                    }
                    this.fetchPosts({ silent: false });
                }
            },

            backFromDetail: function () {
                // 返回到进入详情前的列表页面
                if (this.lastListPage === 'myPosts') this.showPage('myPosts');
                else this.showPage('home');
            },

            showAlert: function (type, message) {
                // 兼容旧调用：统一走 Toast 弹框
                this.showToast(type, message);
            },

            showToast: function (type, message) {
                var container = document.getElementById('toastContainer');
                if (!container) return;

                var toast = document.createElement('div');
                toast.className = 'toast ' + (type || 'info');

                var dot = document.createElement('div');
                dot.className = 'dot';

                var content = document.createElement('div');
                content.className = 'content';
                content.textContent = message || '';

                var close = document.createElement('button');
                close.className = 'close';
                close.setAttribute('aria-label', '关闭');
                close.innerHTML = '×';
                close.onclick = function () {
                    if (toast && toast.parentNode) toast.parentNode.removeChild(toast);
                };

                toast.appendChild(dot);
                toast.appendChild(content);
                toast.appendChild(close);

                container.appendChild(toast);

                setTimeout(function () {
                    if (toast && toast.parentNode) toast.parentNode.removeChild(toast);
                }, 3200);
            },

            updateAuthMenus: function () {
                // 登录后：隐藏“登录/注册”；未登录：禁用需要登录的页面入口并停留在登录页
                var isAuthed = !!this.token;
                var mLogin = document.getElementById('menuLogin');
                var mReg = document.getElementById('menuRegister');

                var protectedPages = ['home', 'myPosts', 'createPost', 'test'];

                // 处理菜单禁用态
                protectedPages.forEach(function (p) {
                    var item = document.querySelector('[data-page="' + p + '"]');
                    if (!item) return;
                    if (isAuthed) item.classList.remove('disabled');
                    else item.classList.add('disabled');
                });

                if (isAuthed) {
                    mLogin.classList.add('hidden');
                    mReg.classList.add('hidden');
                } else {
                    mLogin.classList.remove('hidden');
                    mReg.classList.remove('hidden');
                }
            },

            updateUserDisplay: function () {
                var display = document.getElementById('userDisplay');
                var logoutBtn = document.getElementById('logoutBtn');

                if (this.user) {
                    display.textContent = '👤 ' + this.user.username;
                    logoutBtn.classList.remove('hidden');
                } else {
                    display.textContent = '';
                    logoutBtn.classList.add('hidden');
                }
            },

            /* ===== 认证 ===== */
            fetchProfile: function () {
                var self = this;
                return this.requestJson(this.apiBase + '/profile', {
                    headers: { 'Authorization': 'Bearer ' + this.token }
                }, '正在加载用户信息...')
                    .then(function (data) {
                        if (data.code === 200) {
                            self.user = data.data;
                            self.updateUserDisplay();
                            self.updateAuthMenus();
                        } else {
                            self.handleLogout(true);
                        }
                    })
                    .catch(function (err) {
                        console.error('Fetch profile error:', err);
                    });
            },

            handleLogin: function () {
                var self = this;
                var username = document.getElementById('loginUsername').value;
                var password = document.getElementById('loginPassword').value;

                this.requestJson(this.apiBase + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                }, '正在登录...')
                    .then(function (data) {
                        if (data.code === 200 && data.data && data.data.token) {
                            self.token = data.data.token;
                            localStorage.setItem('token', self.token);
                            return self.fetchProfile().then(function () {
                                self.showAlert('success', '登录成功!');
                                self.showPage('home');
                                document.getElementById('loginForm').reset();
                            });
                        } else {
                            self.showAlert('error', data.message || '登录失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '登录请求失败');
                    });
            },

            // ✅ 注册完成后自动登录（不需要切换菜单再手动登录）
            handleRegisterAutoLogin: function () {
                var self = this;
                var username = document.getElementById('regUsername').value;
                var email = document.getElementById('regEmail').value;
                var password = document.getElementById('regPassword').value;

                this.requestJson(this.apiBase + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, email: email, password: password })
                }, '正在注册...')
                    .then(function (data) {
                        if (data.code === 200) {
                            // 注册成功后立刻登录
                            return self.requestJson(self.apiBase + '/auth/login', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ username: username, password: password })
                            }, '正在自动登录...')
                                .then(function (loginData) {
                                    if (loginData.code === 200 && loginData.data && loginData.data.token) {
                                        self.token = loginData.data.token;
                                        localStorage.setItem('token', self.token);
                                        document.getElementById('registerForm').reset();
                                        return self.fetchProfile().then(function () {
                                            self.showAlert('success', '注册成功，已自动登录!');
                                            self.showPage('home');
                                        });
                                    } else {
                                        self.showAlert('success', '注册成功!（自动登录失败，请手动登录）');
                                        self.showPage('login');
                                    }
                                });
                        } else {
                            self.showAlert('error', data.message || '注册失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '注册请求失败');
                    });
            },

            handleLogout: function (silent) {
                this.token = '';
                this.user = null;
                this.currentPost = null;
                localStorage.removeItem('token');
                this.updateUserDisplay();
                this.updateAuthMenus();
                if (!silent) this.showAlert('success', '已退出登录');
                this.showPage('login');
            },

            /* ===== 列表：文章 + 分页 + 评论数 ===== */
            setPageSize: function (which, size) {
                size = parseInt(size, 10) || 10;
                if (which === 'home') {
                    this.state.home.pageSize = size;
                    this.state.home.page = 1;   // 切换每页条数时回到第一页
                    this.fetchPosts({ silent: false });  // 重新请求后端
                } else {
                    this.state.my.pageSize = size;
                    this.state.my.page = 1;
                    this.fetchMyPosts({ silent: false });  // ⭐ 关键修复：改为请求后端
                }
            },

            refreshHome: function () {
                this.fetchPosts({ silent: false, force: true });
            },

            refreshMyPosts: function () {
                this.fetchMyPosts({ silent: false, force: true });
            },

            fetchPosts: function (opt) {
                var self = this;
                opt = opt || {};
                var container = document.getElementById('postsList');
                container.innerHTML = '<div class="empty-state"><div style="font-size: 38px;">⏳</div><p>正在加载文章列表...</p></div>';

                // 使用后端分页参数
                var page = self.state.home.page || 1;
                var pageSize = self.state.home.pageSize || 8;

                var url = this.apiBase + '/posts?page=' + page + '&page_size=' + pageSize;

                return this.requestJson(url, {}, opt.silent ? null : '正在加载文章列表...')
                    .then(function (data) {
                        if (data.code === 200) {
                            var posts = (data.data && data.data.posts) ? data.data.posts : [];
                            var pagination = data.data.pagination || {};

                            self.state.home.all = posts;
                            self.state.home.total = pagination.total || 0;
                            self.state.home.page = pagination.page || 1;
                            self.state.home.pageSize = pageSize; // 以前端为准
                            self.state.home.totalPage = pagination.total_page || 1;

                            document.getElementById('homeCount').textContent =
                                '共 ' + self.state.home.total + ' 篇';

                            document.getElementById('homeSubTitle').textContent =
                                self.state.home.total ? ('第 ' + self.state.home.page + ' 页') : '暂无内容';

                            self.renderList('home');
                            self.updateCommentBadgesForList('home');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '获取文章列表失败');
                    });
            },

            fetchMyPosts: function (opt) {
                var self = this;
                opt = opt || {};
                var container = document.getElementById('myPostsList');

                if (!this.token) {
                    this.showAlert('error', '请先登录');
                    container.innerHTML = '<div class="empty-state"><div style="font-size: 38px;">🔐</div><p>请先登录后查看我的文章</p></div>';
                    return Promise.resolve();
                }

                container.innerHTML = '<div class="empty-state"><div style="font-size: 38px;">⏳</div><p>正在加载我的文章...</p></div>';

                var page = self.state.my.page || 1;
                var pageSize = self.state.my.pageSize || 10;
                // 定义一个函数来递归获取所有文章
                function fetchAllPosts(currentPage, allPosts) {
                    var fetchPageSize = 100; // 每次请求100条，减少请求次数
                    return self.requestJson(self.apiBase + '/posts?page=' + currentPage + '&page_size=' + fetchPageSize, {
                        headers: { 'Authorization': 'Bearer ' + self.token }
                    }, null)
                        .then(function (data) {
                            if (data.code === 200 && data.data && data.data.posts) {
                                var posts = data.data.posts;
                                allPosts = allPosts.concat(posts);

                                var pagination = data.data.pagination || {};
                                // 如果还有更多页，继续请求
                                if (currentPage < (pagination.total_page || 1)) {
                                    return fetchAllPosts(currentPage + 1, allPosts);
                                } else {
                                    return allPosts;
                                }
                            } else {
                                return allPosts;
                            }
                        });
                }

                // 从第一页开始获取所有文章
                return fetchAllPosts(1, [])
                    .then(function (allPosts) {
                        // 过滤出当前用户的所有文章
                        var allMyPosts = allPosts.filter(function (post) {
                            return self.user && post.user_id === self.user.id;
                        });
                        // 计算总数和总页数
                        var myTotal = allMyPosts.length;
                        var myTotalPages = Math.ceil(myTotal / pageSize) || 1;

                        // 确保当前页不超过总页数
                        if (page > myTotalPages) {
                            page = myTotalPages;
                            self.state.my.page = page;
                        }

                        // 前端分页：从所有我的文章中截取当前页
                        var startIndex = (page - 1) * pageSize;
                        var endIndex = startIndex + pageSize;
                        var myPostsCurrentPage = allMyPosts.slice(startIndex, endIndex);

                        self.state.my.all = myPostsCurrentPage;
                        self.state.my.total = myTotal;
                        self.state.my.page = page;
                        self.state.my.pageSize = pageSize;
                        self.state.my.totalPage = myTotalPages;

                        document.getElementById('myCount').textContent = '共 ' + myTotal + ' 篇';
                        document.getElementById('mySubTitle').textContent = myTotal ? ('第 ' + page + ' / ' + myTotalPages + ' 页') : '暂无内容';

                        self.renderList('my');
                        self.updateCommentBadgesForList('my');
                    }).catch(function (err) {
                        console.error('fetchMyPosts error:', err);
                        self.showAlert('error', '获取我的文章失败');
                    });
            },

            renderList: function (which) {
                var self = this;
                var st = (which === 'home') ? this.state.home : this.state.my;
                var containerId = (which === 'home') ? 'postsList' : 'myPostsList';
                var pagerId = (which === 'home') ? 'homePagination' : 'myPagination';

                var container = document.getElementById(containerId);
                var pager = document.getElementById(pagerId);

                var posts = st.all || [];
                if (!posts.length) {
                    container.innerHTML = '<div class="empty-state"><div style="font-size: 40px;">📭</div><p>暂无文章</p></div>';
                    pager.innerHTML = '';
                    return;
                }

                var totalPages = st.totalPage || 1;
                st.page = Math.min(Math.max(1, st.page), totalPages);

                var slice = posts; // 后端已分页，直接使用当前页数据

                container.innerHTML = slice.map(function (post, postIndex) {
                    var showActions = (which === 'my');
                    var actions = '';
                    if (showActions && self.user && post.user_id === self.user.id) {
                        actions = '<div class="post-actions">' +
                            '<button class="btn btn-primary btn-small" onclick="app.editPost(' + post.ID + ')">✏️ 编辑</button>' +
                            '<button class="btn btn-danger btn-small" onclick="app.deletePost(' + post.ID + ')">🗑️ 删除</button>' +
                            '</div>';
                    }

                    var preview = (post.content || '').substring(0, 140) + ((post.content || '').length > 140 ? '...' : '');
                    var commentCount = (post.comment_count !== undefined && post.comment_count !== null) ? post.comment_count : '-';
                    var badgeId = 'cmt_' + which + '_' + post.ID;

                    return '<div class="post-card">' +
                        '<div class="post-head">' +
                        '<div style="min-width:0;flex:1;">' +
                        '<h3 class="post-title" title="' + self.escapeHtml(post.title) + '" onclick="app.viewPost(' + post.ID + ')">' + `${postIndex + 1} . ` + self.escapeHtml(post.title) + '</h3>' +
                        '<div class="post-meta">' +
                        '<span class="pill">👤 ' + self.escapeHtml(post.user ? post.user.username : '未知') + '</span>' +
                        '<span class="pill">📅 ' + self.escapeHtml(self.formatTime(post.CreatedAt)) + '</span>' +
                        '<span class="pill" id="' + badgeId + '">💬 ' + self.escapeHtml(commentCount) + '</span>' +
                        '</div>' +
                        '</div>' +
                        (actions ? actions : '') +
                        '</div>' +
                        '<div class="post-content">' + self.escapeHtml(preview) + '</div>' +
                        '</div>';
                }).join('');

                // 分页
                pager.innerHTML = this.buildPaginationHtml(which, totalPages, st.page);
            },

            buildPaginationHtml: function (which, totalPages, currentPage) {
                var disabledPrev = currentPage <= 1 ? 'disabled' : '';
                var disabledNext = currentPage >= totalPages ? 'disabled' : '';

                // 页码按钮：最多 7 个
                var maxBtns = 7;
                var start = Math.max(1, currentPage - Math.floor(maxBtns / 2));
                var end = Math.min(totalPages, start + maxBtns - 1);
                start = Math.max(1, end - maxBtns + 1);

                var html = '';
                html += '<button class="page-btn" ' + disabledPrev + ' onclick="app.gotoPage(\'' + which + '\',' + (currentPage - 1) + ')">上一页</button>';

                if (start > 1) {
                    html += '<button class="page-btn" onclick="app.gotoPage(\'' + which + '\',1)">1</button>';
                    if (start > 2) html += '<span class="muted" style="padding:0 4px;">…</span>';
                }

                for (var i = start; i <= end; i++) {
                    html += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="app.gotoPage(\'' + which + '\',' + i + ')">' + i + '</button>';
                }

                if (end < totalPages) {
                    if (end < totalPages - 1) html += '<span class="muted" style="padding:0 4px;">…</span>';
                    html += '<button class="page-btn" onclick="app.gotoPage(\'' + which + '\',' + totalPages + ')">' + totalPages + '</button>';
                }

                html += '<button class="page-btn" ' + disabledNext + ' onclick="app.gotoPage(\'' + which + '\',' + (currentPage + 1) + ')">下一页</button>';
                html += '<span class="muted" style="margin-left:8px;">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
                return html;
            },

            gotoPage: function (which, page) {
                if (which === 'home') {
                    this.state.home.page = page;
                    this.fetchPosts({ silent: false });
                } else {
                    this.state.my.page = page;
                    this.fetchMyPosts({ silent: false });  // ⭐ 改为请求后端
                }
                // 切页时不需要全屏 loading，视觉更顺滑
            },

            // 评论数：优先使用后端字段 comment_count；如果没有，则对当前页做轻量补齐
            updateCommentBadgesForList: function (which, opt) {
                var self = this;
                opt = opt || {};
                var st = (which === 'home') ? this.state.home : this.state.my;

                // 仅补齐当前页（避免 n+1 过重）
                var posts = st.all || [];
                if (!posts.length) return;

                var totalPages = st.totalPage || 1;
                var page = Math.min(Math.max(1, st.page), totalPages);
                var slice = posts;

                slice.forEach(function (post) {
                    if (post.comment_count !== undefined && post.comment_count !== null) return;

                    var badgeId = 'cmt_' + which + '_' + post.ID;
                    var badge = document.getElementById(badgeId);
                    if (!badge) return;

                    // 防重复请求：打标记
                    if (badge.dataset.loading === '1') return;
                    badge.dataset.loading = '1';
                    badge.textContent = '💬 ...';

                    self.requestJson(self.apiBase + '/comments/post/' + post.ID, {}, null)
                        .then(function (data) {
                            var count = 0;
                            if (data && data.code === 200 && Array.isArray(data.data)) count = data.data.length;
                            post.comment_count = count; // 写回缓存
                            badge.textContent = '💬 ' + count;
                            badge.dataset.loading = '0';
                        })
                        .catch(function () {
                            badge.textContent = '💬 -';
                            badge.dataset.loading = '0';
                        });
                });
            },

            /* ===== 详情：解决“进入详情先看到上一条内容” ===== */
            viewPost: function (id) {
                var self = this;

                // 先清空内容，再请求（避免旧内容残留）
                this.currentPost = null;
                document.getElementById('postDetail').innerHTML = '<div class="empty-state"><div style="font-size:38px;">⏳</div><p>正在加载文章详情...</p></div>';
                document.getElementById('commentsList').innerHTML = '<p class="muted" style="text-align:center;">正在加载评论...</p>';
                document.getElementById('commentContent').value = '';

                // 直接切到详情页（同时显示 loading）
                document.querySelectorAll('.page').forEach(function (p) { p.classList.add('hidden'); });
                document.getElementById('postDetailPage').classList.remove('hidden');

                this.setLoading(true, '正在加载文章详情...');
                fetch(this.apiBase + '/posts/' + id)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        if (data.code === 200) {
                            self.currentPost = data.data;
                            self.renderPostDetail(data.data);
                            return self.fetchComments(id);
                        } else {
                            self.showAlert('error', data.message || '获取文章详情失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '获取文章详情失败');
                    })
                    .finally(function () {
                        self.setLoading(false);
                    });
            },

            renderPostDetail: function (post) {
                var container = document.getElementById('postDetail');
                container.innerHTML = '<div class="post-detail-header"><h2>' + this.escapeHtml(post.title) + '</h2>' +
                    '<div class="post-meta">' +
                    '<span class="pill">👤 ' + this.escapeHtml(post.user ? post.user.username : '未知') + '</span>' +
                    '<span class="pill">📅 ' + this.escapeHtml(this.formatTime(post.CreatedAt)) + '</span>' +
                    '</div></div>' +
                    '<div class="post-content" style="line-height: 1.9; white-space: pre-wrap;">' + this.escapeHtml(post.content || '') + '</div>';

                var commentForm = document.getElementById('commentForm');
                if (this.token) {
                    commentForm.classList.remove('hidden');
                } else {
                    commentForm.classList.add('hidden');
                }
            },

            fetchComments: function (postId) {
                var self = this;
                return this.requestJson(this.apiBase + '/comments/post/' + postId, {}, null)
                    .then(function (data) {
                        if (data.code === 200) {
                            self.renderComments(data.data || []);
                        } else {
                            self.renderComments([]);
                        }
                    })
                    .catch(function (err) {
                        console.error('Fetch comments error:', err);
                        self.renderComments([]);
                    });
            },

            renderComments: function (comments) {
                var container = document.getElementById('commentsList');

                if (!comments || comments.length === 0) {
                    container.innerHTML = '<p class="muted" style="text-align: center;">暂无评论，快来发表第一条评论吧!</p>';
                    return;
                }

                container.innerHTML = comments.map(function (comment) {
                    var user = comment.user ? comment.user.username : '未知';
                    return '<div class="comment-card">' +
                        '<div class="comment-meta">👤 ' + app.escapeHtml(user) + ' | ' + app.escapeHtml(app.formatTime(comment.CreatedAt)) + '</div>' +
                        '<div class="comment-content">' + app.escapeHtml(comment.content || '') + '</div>' +
                        '</div>';
                }).join('');
            },

            /* ===== 文章操作（加 loading，避免视觉延迟） ===== */
            handleCreatePost: function () {
                var self = this;
                if (!this.token) {
                    this.showAlert('error', '请先登录');
                    return;
                }

                var title = document.getElementById('postTitle').value;
                var content = document.getElementById('postContent').value;

                this.requestJson(this.apiBase + '/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + this.token
                    },
                    body: JSON.stringify({ title: title, content: content })
                }, '正在发布文章...')
                    .then(function (data) {
                        if (data.code === 200) {
                            self.showAlert('success', '文章发布成功!');
                            document.getElementById('createPostForm').reset();
                            self.showPage('myPosts');
                        } else {
                            self.showAlert('error', data.message || '发布失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '发布请求失败');
                    });
            },

            editPost: function (id) {
                var self = this;
                // 先切页并清空，避免残留
                document.getElementById('editPostId').value = '';
                document.getElementById('editPostTitle').value = '';
                document.getElementById('editPostContent').value = '';

                document.querySelectorAll('.page').forEach(function (p) { p.classList.add('hidden'); });
                document.getElementById('editPostPage').classList.remove('hidden');

                this.requestJson(this.apiBase + '/posts/' + id, {}, '正在加载文章...')
                    .then(function (data) {
                        if (data.code === 200) {
                            document.getElementById('editPostId').value = data.data.ID;
                            document.getElementById('editPostTitle').value = data.data.title;
                            document.getElementById('editPostContent').value = data.data.content;
                        } else {
                            self.showAlert('error', data.message || '获取文章信息失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '获取文章信息失败');
                    });
            },

            handleUpdatePost: function () {
                var self = this;
                var id = document.getElementById('editPostId').value;
                var title = document.getElementById('editPostTitle').value;
                var content = document.getElementById('editPostContent').value;

                this.requestJson(this.apiBase + '/posts/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + this.token
                    },
                    body: JSON.stringify({ title: title, content: content })
                }, '正在保存修改...')
                    .then(function (data) {
                        if (data.code === 200) {
                            self.showAlert('success', '文章更新成功!');
                            self.showPage('myPosts');
                        } else {
                            self.showAlert('error', data.message || '更新失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '更新请求失败');
                    });
            },

            deletePost: function (id) {
                var self = this;
                if (!confirm('确定要删除这篇文章吗?')) return;

                this.requestJson(this.apiBase + '/posts/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + this.token }
                }, '正在删除文章...')
                    .then(function (data) {
                        if (data.code === 200) {
                            self.showAlert('success', '文章删除成功!');
                            self.fetchMyPosts({ silent: true });
                            self.fetchPosts({ silent: true });
                        } else {
                            self.showAlert('error', data.message || '删除失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '删除请求失败');
                    });
            },

            handleCreateComment: function () {
                var self = this;
                if (!this.token) {
                    this.showAlert('error', '请先登录');
                    return;
                }
                if (!this.currentPost || !this.currentPost.ID) {
                    this.showAlert('error', '文章未加载完成，请稍后重试');
                    return;
                }

                var content = document.getElementById('commentContent').value;
                var postId = this.currentPost.ID;

                this.requestJson(this.apiBase + '/posts/' + postId + '/comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + this.token
                    },
                    body: JSON.stringify({ content: content })
                }, '正在发表评论...')
                    .then(function (data) {
                        if (data.code === 200) {
                            self.showAlert('success', '评论发表成功!');
                            document.getElementById('commentContent').value = '';
                            self.fetchComments(postId).then(function () {
                                // 更新列表缓存的评论数
                                self.bumpCachedCommentCount(postId);
                            });
                        } else {
                            self.showAlert('error', data.message || '评论失败');
                        }
                    })
                    .catch(function () {
                        self.showAlert('error', '评论请求失败');
                    });
            },

            bumpCachedCommentCount: function (postId) {
                // 让首页/我的文章上显示的评论数+1（若存在）
                var lists = [this.state.home.all, this.state.my.all];
                lists.forEach(function (arr) {
                    if (!arr) return;
                    arr.forEach(function (p) {
                        if (p.ID === postId && typeof p.comment_count === 'number') p.comment_count += 1;
                    });
                });

                // 同步当前可见徽章
                ['home', 'my'].forEach(function (which) {
                    var badge = document.getElementById('cmt_' + which + '_' + postId);
                    if (badge) {
                        var txt = badge.textContent.replace('💬', '').trim();
                        var n = parseInt(txt, 10);
                        if (!isNaN(n)) badge.textContent = '💬 ' + (n + 1);
                    }
                });
            },

            /* ===== API测试（保留原逻辑） ===== */
            addTestResult: function (message, success) {
                var results = document.getElementById('testResults');
                var div = document.createElement('div');
                div.className = 'test-item test-' + (success ? 'success' : 'error');
                div.textContent = new Date().toLocaleTimeString() + ' - ' + message;
                results.insertBefore(div, results.firstChild);
            },

            clearTestResults: function () {
                document.getElementById('testResults').innerHTML = '<p style="color: #8c8c8c;">测试结果将显示在这里...</p>';
            },

            testHealth: function () {
                var self = this;
                this.addTestResult('开始健康检查测试...', true);

                fetch('http://localhost:8080/health')
                    .then(function (res) {
                        if (res.ok) {
                            self.addTestResult('✔ 健康检查通过', true);
                        } else {
                            self.addTestResult('✗ 健康检查失败', false);
                        }
                    })
                    .catch(function (err) {
                        self.addTestResult('✗ 健康检查错误: ' + err.message, false);
                    });
            },

            testAuth: function () {
                var self = this;
                this.addTestResult('开始认证测试...', true);

                var testUser = {
                    username: 'test_' + Date.now(),
                    email: 'test_' + Date.now() + '@example.com',
                    password: 'test123456'
                };

                fetch(this.apiBase + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testUser)
                })
                    .then(function (res) { return res.json(); })
                    .then(function (regData) {
                        if (regData.code === 200) {
                            self.addTestResult('✔ 注册测试通过', true);

                            return fetch(self.apiBase + '/auth/login', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username: testUser.username,
                                    password: testUser.password
                                })
                            });
                        } else {
                            self.addTestResult('✗ 注册测试失败', false);
                            throw new Error('Registration failed');
                        }
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (loginData) {
                        if (loginData.code === 200 && loginData.data.token) {
                            self.addTestResult('✔ 登录测试通过', true);

                            return fetch(self.apiBase + '/profile', {
                                headers: { 'Authorization': 'Bearer ' + loginData.data.token }
                            });
                        } else {
                            self.addTestResult('✗ 登录测试失败', false);
                            throw new Error('Login failed');
                        }
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (profileData) {
                        if (profileData.code === 200) {
                            self.addTestResult('✔ 获取用户信息测试通过', true);
                        } else {
                            self.addTestResult('✗ 获取用户信息测试失败', false);
                        }
                    })
                    .catch(function (err) {
                        self.addTestResult('✗ 认证测试错误: ' + err.message, false);
                    });
            },

            testPosts: function () {
                var self = this;
                if (!this.token) {
                    this.addTestResult('✗ 请先登录后再测试文章功能', false);
                    return;
                }

                this.addTestResult('开始文章测试...', true);

                var postData = {
                    title: '测试文章 ' + Date.now(),
                    content: '这是一篇测试文章的内容'
                };

                var postId;

                fetch(this.apiBase + '/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + this.token
                    },
                    body: JSON.stringify(postData)
                })
                    .then(function (res) { return res.json(); })
                    .then(function (createData) {
                        if (createData.code === 200) {
                            self.addTestResult('✔ 创建文章测试通过', true);
                            postId = createData.data.ID;

                            return fetch(self.apiBase + '/posts/' + postId);
                        } else {
                            self.addTestResult('✗ 创建文章测试失败', false);
                            throw new Error('Create post failed');
                        }
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (getData) {
                        if (getData.code === 200) {
                            self.addTestResult('✔ 获取文章详情测试通过', true);

                            return fetch(self.apiBase + '/posts/' + postId, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': 'Bearer ' + self.token
                                },
                                body: JSON.stringify({
                                    title: '更新后的标题',
                                    content: '更新后的内容'
                                })
                            });
                        } else {
                            self.addTestResult('✗ 获取文章详情测试失败', false);
                            throw new Error('Get post failed');
                        }
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (updateData) {
                        if (updateData.code === 200) {
                            self.addTestResult('✔ 更新文章测试通过', true);

                            return fetch(self.apiBase + '/posts/' + postId, {
                                method: 'DELETE',
                                headers: { 'Authorization': 'Bearer ' + self.token }
                            });
                        } else {
                            self.addTestResult('✗ 更新文章测试失败', false);
                            throw new Error('Update post failed');
                        }
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (deleteData) {
                        if (deleteData.code === 200) {
                            self.addTestResult('✔ 删除文章测试通过', true);
                        } else {
                            self.addTestResult('✗ 删除文章测试失败', false);
                        }

                        return fetch(self.apiBase + '/posts');
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (listData) {
                        if (listData.code === 200) {
                            self.addTestResult('✔ 获取文章列表测试通过', true);
                        } else {
                            self.addTestResult('✗ 获取文章列表测试失败', false);
                        }
                    })
                    .catch(function (err) {
                        self.addTestResult('✗ 文章测试错误: ' + err.message, false);
                    });
            },

            testComments: function () {
                var self = this;
                if (!this.token) {
                    this.addTestResult('✗ 请先登录后再测试评论功能', false);
                    return;
                }

                this.addTestResult('开始评论测试...', true);

                var postId;

                fetch(this.apiBase + '/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + this.token
                    },
                    body: JSON.stringify({
                        title: '测试评论文章',
                        content: '用于测试评论功能'
                    })
                })
                    .then(function (res) { return res.json(); })
                    .then(function (postData) {
                        if (postData.code === 200) {
                            postId = postData.data.ID;

                            return fetch(self.apiBase + '/posts/' + postId + '/comments', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': 'Bearer ' + self.token
                                },
                                body: JSON.stringify({
                                    content: '这是一条测试评论'
                                })
                            });
                        } else {
                            throw new Error('Create post for comments failed');
                        }
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (commentData) {
                        if (commentData.code === 200) {
                            self.addTestResult('✔ 创建评论测试通过', true);

                            return fetch(self.apiBase + '/comments/post/' + postId);
                        } else {
                            self.addTestResult('✗ 创建评论测试失败', false);
                            throw new Error('Create comment failed');
                        }
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (getCommentsData) {
                        if (getCommentsData.code === 200) {
                            self.addTestResult('✔ 获取评论列表测试通过', true);
                        } else {
                            self.addTestResult('✗ 获取评论列表测试失败', false);
                        }

                        return fetch(self.apiBase + '/posts/' + postId, {
                            method: 'DELETE',
                            headers: { 'Authorization': 'Bearer ' + self.token }
                        });
                    })
                    .then(function () {
                        // Cleanup done
                    })
                    .catch(function (err) {
                        self.addTestResult('✗ 评论测试错误: ' + err.message, false);
                    });
            },

            runAllTests: function () {
                var self = this;
                this.clearTestResults();
                this.addTestResult('=== 开始运行全部测试 ===', true);

                this.testHealth();

                setTimeout(function () {
                    self.testAuth();
                }, 1000);

                setTimeout(function () {
                    self.testPosts();
                }, 2000);

                setTimeout(function () {
                    self.testComments();
                }, 3000);

                setTimeout(function () {
                    self.addTestResult('=== 全部测试完成 ===', true);
                }, 5000);
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            app.init();
        });
    </script>
</body>

</html>
